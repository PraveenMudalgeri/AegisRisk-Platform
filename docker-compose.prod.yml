version: '3.8'

services:
  backend:
    build: ./backend
    container_name: aegis_backend_prod
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=aegisrisk
      - REDIS_HOST=redis
      - SECRET_KEY=production_secret_key_change_me
    depends_on:
      - db
      - redis
    restart: always

  frontend:
    build: ./frontend
    container_name: aegis_frontend_build
    volumes:
      - frontend_build:/app/dist

  nginx:
    image: nginx:alpine
    container_name: aegis_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_build:/usr/share/nginx/html
    depends_on:
      - backend
      - frontend
    restart: always

  db:
    image: postgres:15
    container_name: aegis_db_prod
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aegisrisk
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: aegis_redis_prod
    restart: always

volumes:
  postgres_data_prod:
  frontend_build:
