events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name localhost;

        # serve frontend static files
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # proxy api requests to backend
        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # proxy auth token endpoint (if at root /token or /auth)
        # assuming tokens are under /api/auth or similar. 
        # based on previous steps, auth is at /token. Check main.py if needed.
        # Actually our backend main.py mounts auth at root usually? 
        # Let's check main.py content from memory/history.
        # Step 336 showed `app.include_router(auth_routes.router)`.
        # `auth_routes` usually has `/token`. 
        # So we need to proxy /token as well optionally? 
        # Or better yet, we successfully moved domain routers to /api prefix in Step 339.
        # Auth might still be at root. Safe to proxy specific auth paths if needed.
        
        location /token {
             proxy_pass http://backend:8000/token;
             proxy_set_header Host $host;
        }
        
        location /users/ {
             proxy_pass http://backend:8000/users/;
             proxy_set_header Host $host;
        }
    }
}
